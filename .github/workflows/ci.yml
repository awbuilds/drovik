name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: hashFiles('backend/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        if: hashFiles('backend/go.mod') != ''
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        if: hashFiles('backend/go.mod') != ''
        run: cd backend && go vet ./...

      - name: Test
        if: hashFiles('backend/go.mod') != ''
        run: cd backend && go test -race ./...

      - name: Lint
        if: hashFiles('backend/go.mod') != '' && hashFiles('backend/.golangci.yml') != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend

      - name: Skip notice
        if: hashFiles('backend/go.mod') == ''
        run: echo "Backend not present yet; skipping."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: hashFiles('frontend/package.json') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.1

      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm lint

      - name: Typecheck
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm typecheck

      - name: Test
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm test

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm build

      - name: Audit dependencies
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && pnpm audit --audit-level high

      - name: Skip notice
        if: hashFiles('frontend/package.json') == ''
        run: echo "Frontend not present yet; skipping."

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate OpenAPI document
        run: ruby -e 'require "yaml"; YAML.load_file("docs/api/openapi.yaml")'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan repository
        run: gitleaks detect --source . --redact --no-banner --verbose
