version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
