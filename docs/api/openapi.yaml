openapi: 3.1.0
info:
  title: Drovik API
  version: 0.1.0
  description: |
    Versioned HTTP API for the Drovik self-hosted server workspace.

    Phase 1 covers setup, local authentication, sessions and build metadata.
    SSH, SFTP, terminal, monitoring, process, service and log endpoints are added
    in later phases.

    All responses use a stable machine-readable error envelope. Secrets are never
    returned after submission and never appear in errors or audit metadata.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: Same-origin deployment

tags:
  - name: Setup
  - name: Authentication
  - name: Servers
  - name: Files
  - name: Monitoring
  - name: Processes
  - name: Services
  - name: Logs
  - name: Activity
  - name: Terminal
  - name: System

paths:
  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Whether first-run setup is still required
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/setup:
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Create the initial administrator
      description: |
        Allowed only while no user exists. The public route is disabled after the
        first administrator is created. Complete setup before exposing a new
        installation to the internet.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Administrator created and signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with a local username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated user and CSRF token
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current session identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Build and schema identity
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe (configuration and database)
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List saved SSH servers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authorized servers
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Save an SSH connection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created; the credential is encrypted and never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Servers]
      operationId: getServer
      summary: Get a saved server
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Server metadata without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: Update metadata or replace the credential
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerRequest"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Delete a saved connection and its credential
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Server deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Servers]
      operationId: testServerConnection
      summary: Test SSH reachability, host key and capabilities
      description: |
        Returns `409 SSH_HOST_KEY_UNKNOWN` or `409 SSH_HOST_KEY_CHANGED` with the
        presented key details when explicit host-key approval is required.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Connection verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Host key approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: SSH connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: SSH operation timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/trust-host-key:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Servers]
      operationId: trustServerHostKey
      summary: Approve or replace a presented host key
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustHostKeyRequest"
      responses:
        "204":
          description: Host key trusted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A different host key is already approved and `replace` was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/servers/{id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Servers]
      operationId: getServerCapabilities
      summary: Get the last detected host capabilities
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cached capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/terminal:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Terminal]
      operationId: openTerminal
      summary: Upgrade to an authenticated SSH PTY WebSocket
      description: |
        HTTP Upgrade to a WebSocket carrying a JSON terminal protocol. The
        `drovik_session` cookie authenticates the request and the `Origin`
        header must match a configured trusted origin. See
        `docs/api/terminal-protocol.md` for the message envelopes.
      security:
        - cookieAuth: []
      parameters:
        - name: Origin
          in: header
          required: true
          description: Browser origin; must match DROVIK_TRUSTED_ORIGINS.
          schema:
            type: string
            format: uri
      responses:
        "101":
          description: Switching Protocols; the connection becomes a terminal WebSocket
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Session or input limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: listFiles
      summary: List a remote directory over SFTP
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute remote path; empty uses the SFTP home directory.
          schema:
            type: string
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a remote file or directory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: Required to delete a non-empty directory. Symlinks are removed, not followed.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/stat:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: statFile
      summary: Stat a remote path
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/files/download:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Stream a remote file
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File stream
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/files/upload:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Upload a file over SFTP
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: overwrite
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
        "409":
          description: Target exists and overwrite was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: File exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: createDirectory
      summary: Create a remote directory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathRequest"
      responses:
        "201":
          description: Directory created
        "409":
          description: Path exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/touch:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: createFile
      summary: Create an empty remote file
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathRequest"
      responses:
        "201":
          description: File created
        "409":
          description: Path exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/rename:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    patch:
      tags: [Files]
      operationId: renameFile
      summary: Rename or move a remote item
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "204":
          description: Renamed
        "409":
          description: Target exists and overwrite was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/content:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: readFile
      summary: Read a bounded text file for editing
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Text content and version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Files]
      operationId: writeFile
      summary: Save a text file if it has not changed remotely
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteFileRequest"
      responses:
        "204":
          description: Saved
        "409":
          description: Remote file changed since it was opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Content exceeds the editor limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/overview:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Monitoring]
      operationId: getServerOverview
      summary: Collect a bounded host metrics snapshot
      description: |
        Reads `/proc`, `df` and `uname` over a short-lived SSH connection. The
        snapshot is cached per server for the configured minimum interval and
        concurrent requests are coalesced. The first sample reports CPU usage
        and network rates as `null`; they require two counter samples.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Metrics snapshot
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Host-key approval is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The host does not expose readable metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: SSH connection or collection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Metrics collection timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Processes]
      operationId: listProcesses
      summary: List processes visible to the SSH account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Bounded process list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Process tools are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/processes/{pid}/signal:
    parameters:
      - $ref: "#/components/parameters/ServerID"
      - $ref: "#/components/parameters/PID"
    post:
      tags: [Processes]
      operationId: signalProcess
      summary: Send SIGTERM or SIGKILL after an identity check
      description: |
        The server re-reads the process start time and rejects the request if the
        identity changed. SIGKILL is only accepted when the client explicitly
        sends it. PID 1 is never signaled.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalProcessRequest"
      responses:
        "200":
          description: Signal delivered and the process re-checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalProcessResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Process no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Process identity changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/servers/{id}/services:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Services]
      operationId: listServices
      summary: List systemd service units
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Service units with active, sub and file state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: systemd is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/services/{unit}/action:
    parameters:
      - $ref: "#/components/parameters/ServerID"
      - $ref: "#/components/parameters/UnitName"
    post:
      tags: [Services]
      operationId: runServiceAction
      summary: Run an enumerated systemd action and re-read state
      description: |
        Actions are limited to start, stop, restart, reload, enable and disable.
        The unit identifier is validated before use and the request runs as the
        configured SSH user without sudo or privilege escalation.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceActionRequest"
      responses:
        "200":
          description: Action completed; resulting state is included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceActionResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: The remote systemctl action failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Logs]
      operationId: readJournalLogs
      summary: Read a bounded systemd journal window
      description: |
        Returns structured journal entries for the system or one service unit.
        Output is bounded by line count, byte limit and command timeout, and is
        never persisted by Drovik.
      security:
        - cookieAuth: []
      parameters:
        - name: unit
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            enum: [15m, 1h, 24h, 7d, all]
            default: 1h
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Journal window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid query or journal unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/activity:
    get:
      tags: [Activity]
      operationId: listActivity
      summary: List scoped audit history
      description: |
        Returns recent audit events for the current actor or servers owned by
        the current user. Audit history is metadata only and never includes
        credentials, file contents or log contents.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: drovik_session
      description: Opaque server-side session cookie (HttpOnly).

  parameters:
    ServerID:
      name: id
      in: path
      required: true
      description: Saved server identifier.
      schema:
        type: string

    PID:
      name: pid
      in: path
      required: true
      description: Positive process identifier.
      schema:
        type: integer
        minimum: 2

    UnitName:
      name: unit
      in: path
      required: true
      description: systemd service unit identifier.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.@:\-]{0,254}\.service$'

    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound synchronizer token returned by login, setup or `/auth/me`.
      schema:
        type: string
        minLength: 32

  responses:
    Unauthorized:
      description: Authentication is required or the session is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: The request is malformed or does not meet policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          type: string
          minLength: 12
          maxLength: 256
          format: password

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password

    AuthResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          minLength: 32
          description: Token to send in `X-CSRF-Token` for mutations.

    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, operator, read_only]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    VersionInfo:
      type: object
      required: [version, commit, build_date, go_version, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        go_version:
          type: string
        schema_version:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples:
                - AUTH_REQUIRED
                - AUTH_INVALID_CREDENTIALS
                - CSRF_INVALID
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: Safe human-readable message; never contains secrets.
            correlation_id:
              type: string
            details:
              description: Optional safe structured details.

    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [display_name, host, username, auth_method]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        username:
          type: string
          minLength: 1
          maxLength: 64
        auth_method:
          type: string
          enum: [password, private_key]
        password:
          type: string
          maxLength: 1024
          format: password
        private_key:
          type: string
          maxLength: 65536
          description: OpenSSH or PEM private key; encrypted before storage.
        passphrase:
          type: string
          maxLength: 1024
          format: password
        tags:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    UpdateServerRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 64
        auth_method:
          type: string
          enum: [password, private_key]
        password:
          type: string
          maxLength: 1024
          format: password
        private_key:
          type: string
          maxLength: 65536
        passphrase:
          type: string
          maxLength: 1024
          format: password
        tags:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    Server:
      type: object
      required: [id, display_name, host, port, username, auth_method, created_at, updated_at, is_active]
      properties:
        id:
          type: string
        display_name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        auth_method:
          type: string
          enum: [password, private_key]
        tags:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_connected_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean

    HostKeyInfo:
      type: object
      required: [key_type, fingerprint, public_key]
      properties:
        key_type:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint shown to the operator.
        public_key:
          type: string
          description: Base64 SSH wire-format public key. Not secret.

    Capabilities:
      type: object
      properties:
        os:
          type: string
        kernel:
          type: string
        architecture:
          type: string
        distribution:
          type: string
        systemd:
          type: boolean
        journalctl:
          type: boolean
        proc:
          type: boolean
        process_tools:
          type: boolean
        disk_tools:
          type: boolean
        sftp:
          type: boolean
        detected_at:
          type: string
          format: date-time

    ConnectionTest:
      type: object
      required: [server, host_key, capabilities]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        host_key:
          $ref: "#/components/schemas/HostKeyInfo"
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    TrustHostKeyRequest:
      type: object
      additionalProperties: false
      required: [fingerprint, key_type, public_key]
      properties:
        fingerprint:
          type: string
        key_type:
          type: string
        public_key:
          type: string
        replace:
          type: boolean
          default: false
          description: Replace an existing approved key after deliberate re-verification.

    FileEntry:
      type: object
      required: [name, path, type, size, mode, modified_at]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
        modified_at:
          type: string
          format: date-time
        uid:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64

    FileListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        truncated:
          type: boolean

    FileContent:
      type: object
      required: [path, content, size, mode, modified_at]
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
          format: int64
        mode:
          type: string
        modified_at:
          type: string
          format: date-time

    PathRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string

    RenameRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        overwrite:
          type: boolean
          default: false

    WriteFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        expected_modified_at:
          type: string
          format: date-time
        expected_size:
          type: integer
          format: int64

    OverviewSnapshot:
      type: object
      required: [server_id, collected_at, cached, stale, host, cpu, load, memory, uptime, filesystems, filesystems_available, network, network_available, filesystems_truncated, network_truncated]
      properties:
        server_id:
          type: string
        collected_at:
          type: string
          format: date-time
        cached:
          type: boolean
          description: Served from the minimum-interval cache.
        stale:
          type: boolean
          description: The live refresh failed and this is the last successful sample.
        warning:
          type: string
        host:
          $ref: "#/components/schemas/HostInfo"
        cpu:
          $ref: "#/components/schemas/CPUMetrics"
        load:
          $ref: "#/components/schemas/LoadAverage"
        memory:
          $ref: "#/components/schemas/MemoryMetrics"
        uptime:
          $ref: "#/components/schemas/UptimeMetrics"
        filesystems:
          type: array
          items:
            $ref: "#/components/schemas/FilesystemUsage"
        filesystems_available:
          type: boolean
        network:
          type: array
          items:
            $ref: "#/components/schemas/NetworkUsage"
        network_available:
          type: boolean
        filesystems_truncated:
          type: boolean
        network_truncated:
          type: boolean

    HostInfo:
      type: object
      properties:
        hostname:
          type: string
        os:
          type: string
        distribution:
          type: string
        kernel:
          type: string
        architecture:
          type: string

    CPUMetrics:
      type: object
      required: [available, model, cores]
      properties:
        available:
          type: boolean
        usage_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        model:
          type: string
        cores:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index:
                type: integer
              usage_percent:
                type: [number, "null"]

    LoadAverage:
      type: object
      required: [available, one, five, fifteen, runnable, total]
      properties:
        available:
          type: boolean
        one:
          type: number
        five:
          type: number
        fifteen:
          type: number
        runnable:
          type: integer
        total:
          type: integer

    MemoryMetrics:
      type: object
      required: [available, total_bytes, available_bytes, used_bytes, free_bytes, buffers_bytes, cached_bytes, swap_total_bytes, swap_used_bytes]
      properties:
        available:
          type: boolean
        total_bytes:
          type: integer
          format: int64
        available_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        buffers_bytes:
          type: integer
          format: int64
        cached_bytes:
          type: integer
          format: int64
        swap_total_bytes:
          type: integer
          format: int64
        swap_used_bytes:
          type: integer
          format: int64
        used_percent:
          type: [number, "null"]

    UptimeMetrics:
      type: object
      required: [available, seconds, boot_time]
      properties:
        available:
          type: boolean
        seconds:
          type: number
        boot_time:
          type: string
          format: date-time

    FilesystemUsage:
      type: object
      required: [device, mountpoint, fstype, total_bytes, used_bytes, free_bytes, read_only]
      properties:
        device:
          type: string
        mountpoint:
          type: string
        fstype:
          type: string
        total_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        used_percent:
          type: [number, "null"]
        read_only:
          type: boolean

    NetworkUsage:
      type: object
      required: [name, received_bytes, transmitted_bytes]
      properties:
        name:
          type: string
        received_bytes:
          type: integer
          format: int64
        transmitted_bytes:
          type: integer
          format: int64
        receive_rate_bps:
          type: [number, "null"]
          description: Bytes per second; null until two samples exist.
        transmit_rate_bps:
          type: [number, "null"]

    Process:
      type: object
      required: [pid, ppid, user, state, cpu_percent, memory_percent, rss_bytes, elapsed_seconds, started_at, command]
      properties:
        pid:
          type: integer
        ppid:
          type: integer
        user:
          type: string
        state:
          type: string
        cpu_percent:
          type: number
          description: Lifetime average reported by ps.
        memory_percent:
          type: number
        rss_bytes:
          type: integer
          format: int64
        elapsed_seconds:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        command:
          type: string

    ProcessList:
      type: object
      required: [collected_at, account, processes, truncated]
      properties:
        collected_at:
          type: string
          format: date-time
        account:
          type: string
          description: SSH account used for collection.
        processes:
          type: array
          items:
            $ref: "#/components/schemas/Process"
        truncated:
          type: boolean

    SignalProcessRequest:
      type: object
      additionalProperties: false
      required: [signal, expected_started_at]
      properties:
        signal:
          type: string
          enum: [SIGTERM, SIGKILL]
        expected_started_at:
          type: string
          format: date-time
          description: Start time from the current process list; used for the identity check.

    SignalProcessResult:
      type: object
      required: [pid, signal, delivered, running]
      properties:
        pid:
          type: integer
        signal:
          type: string
          enum: [SIGTERM, SIGKILL]
        delivered:
          type: boolean
        running:
          type: boolean
          description: Result of the post-signal status check.
        state:
          type: string

    ServiceUnit:
      type: object
      required: [name, load, active, sub, file_state, description]
      properties:
        name:
          type: string
        load:
          type: string
        active:
          type: string
        sub:
          type: string
        file_state:
          type: string
        description:
          type: string

    ServiceList:
      type: object
      required: [collected_at, units, truncated]
      properties:
        collected_at:
          type: string
          format: date-time
        units:
          type: array
          items:
            $ref: "#/components/schemas/ServiceUnit"
        truncated:
          type: boolean

    ServiceActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart, reload, enable, disable]

    ServiceActionResult:
      type: object
      required: [unit, action, active_state, sub_state, unit_file_state, state_known]
      properties:
        unit:
          type: string
        action:
          type: string
        active_state:
          type: string
        sub_state:
          type: string
        unit_file_state:
          type: string
        state_known:
          type: boolean
          description: False when the action completed but status could not be re-read.
        message:
          type: string

    LogEntry:
      type: object
      required: [timestamp, priority, severity, message]
      properties:
        timestamp:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 0
          maximum: 7
        severity:
          type: string
        message:
          type: string
          description: Untrusted journal text; clients must render it as text, never HTML.
        unit:
          type: string
        identifier:
          type: string

    LogResult:
      type: object
      required: [collected_at, since, lines, entries, truncated]
      properties:
        collected_at:
          type: string
          format: date-time
        unit:
          type: string
        since:
          type: string
        lines:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        truncated:
          type: boolean

    AuditEvent:
      type: object
      required: [id, event_type, target_summary, outcome, created_at]
      properties:
        id:
          type: string
        server_id:
          type: string
        event_type:
          type: string
        target_summary:
          type: string
        outcome:
          type: string
          enum: [success, failure]
        safe_error_code:
          type: string
        created_at:
          type: string
          format: date-time
