openapi: 3.1.0
info:
  title: Drovik API
  version: 0.1.0
  description: |
    Versioned HTTP API for the Drovik self-hosted server workspace.

    Phase 1 covers setup, local authentication, sessions and build metadata.
    SSH, SFTP, terminal, monitoring, process, service and log endpoints are added
    in later phases.

    All responses use a stable machine-readable error envelope. Secrets are never
    returned after submission and never appear in errors or audit metadata.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: Same-origin deployment

tags:
  - name: Setup
  - name: Authentication
  - name: Servers
  - name: Files
  - name: Terminal
  - name: System

paths:
  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Whether first-run setup is still required
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/setup:
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Create the initial administrator
      description: |
        Allowed only while no user exists. The public route is disabled after the
        first administrator is created. Complete setup before exposing a new
        installation to the internet.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Administrator created and signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with a local username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated user and CSRF token
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current session identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Build and schema identity
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe (configuration and database)
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List saved SSH servers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authorized servers
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Save an SSH connection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created; the credential is encrypted and never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Servers]
      operationId: getServer
      summary: Get a saved server
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Server metadata without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: Update metadata or replace the credential
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerRequest"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Delete a saved connection and its credential
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Server deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Servers]
      operationId: testServerConnection
      summary: Test SSH reachability, host key and capabilities
      description: |
        Returns `409 SSH_HOST_KEY_UNKNOWN` or `409 SSH_HOST_KEY_CHANGED` with the
        presented key details when explicit host-key approval is required.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Connection verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Host key approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: SSH connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: SSH operation timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/trust-host-key:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Servers]
      operationId: trustServerHostKey
      summary: Approve or replace a presented host key
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustHostKeyRequest"
      responses:
        "204":
          description: Host key trusted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A different host key is already approved and `replace` was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/servers/{id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Servers]
      operationId: getServerCapabilities
      summary: Get the last detected host capabilities
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cached capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/terminal:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Terminal]
      operationId: openTerminal
      summary: Upgrade to an authenticated SSH PTY WebSocket
      description: |
        HTTP Upgrade to a WebSocket carrying a JSON terminal protocol. The
        `drovik_session` cookie authenticates the request and the `Origin`
        header must match a configured trusted origin. See
        `docs/api/terminal-protocol.md` for the message envelopes.
      security:
        - cookieAuth: []
      parameters:
        - name: Origin
          in: header
          required: true
          description: Browser origin; must match DROVIK_TRUSTED_ORIGINS.
          schema:
            type: string
            format: uri
      responses:
        "101":
          description: Switching Protocols; the connection becomes a terminal WebSocket
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Session or input limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: listFiles
      summary: List a remote directory over SFTP
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute remote path; empty uses the SFTP home directory.
          schema:
            type: string
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a remote file or directory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: Required to delete a non-empty directory. Symlinks are removed, not followed.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/stat:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: statFile
      summary: Stat a remote path
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/files/download:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Stream a remote file
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File stream
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/servers/{id}/files/upload:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Upload a file over SFTP
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: overwrite
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
        "409":
          description: Target exists and overwrite was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: File exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: createDirectory
      summary: Create a remote directory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathRequest"
      responses:
        "201":
          description: Directory created
        "409":
          description: Path exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/touch:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [Files]
      operationId: createFile
      summary: Create an empty remote file
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathRequest"
      responses:
        "201":
          description: File created
        "409":
          description: Path exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/rename:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    patch:
      tags: [Files]
      operationId: renameFile
      summary: Rename or move a remote item
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "204":
          description: Renamed
        "409":
          description: Target exists and overwrite was false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/servers/{id}/files/content:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [Files]
      operationId: readFile
      summary: Read a bounded text file for editing
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Text content and version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Files]
      operationId: writeFile
      summary: Save a text file if it has not changed remotely
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteFileRequest"
      responses:
        "204":
          description: Saved
        "409":
          description: Remote file changed since it was opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Content exceeds the editor limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: drovik_session
      description: Opaque server-side session cookie (HttpOnly).

  parameters:
    ServerID:
      name: id
      in: path
      required: true
      description: Saved server identifier.
      schema:
        type: string

    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound synchronizer token returned by login, setup or `/auth/me`.
      schema:
        type: string
        minLength: 32

  responses:
    Unauthorized:
      description: Authentication is required or the session is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: The request is malformed or does not meet policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          type: string
          minLength: 12
          maxLength: 256
          format: password

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password

    AuthResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          minLength: 32
          description: Token to send in `X-CSRF-Token` for mutations.

    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, operator, read_only]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    VersionInfo:
      type: object
      required: [version, commit, build_date, go_version, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        go_version:
          type: string
        schema_version:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples:
                - AUTH_REQUIRED
                - AUTH_INVALID_CREDENTIALS
                - CSRF_INVALID
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: Safe human-readable message; never contains secrets.
            correlation_id:
              type: string
            details:
              description: Optional safe structured details.

    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [display_name, host, username, auth_method]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        username:
          type: string
          minLength: 1
          maxLength: 64
        auth_method:
          type: string
          enum: [password, private_key]
        password:
          type: string
          maxLength: 1024
          format: password
        private_key:
          type: string
          maxLength: 65536
          description: OpenSSH or PEM private key; encrypted before storage.
        passphrase:
          type: string
          maxLength: 1024
          format: password
        tags:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    UpdateServerRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 64
        auth_method:
          type: string
          enum: [password, private_key]
        password:
          type: string
          maxLength: 1024
          format: password
        private_key:
          type: string
          maxLength: 65536
        passphrase:
          type: string
          maxLength: 1024
          format: password
        tags:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    Server:
      type: object
      required: [id, display_name, host, port, username, auth_method, created_at, updated_at, is_active]
      properties:
        id:
          type: string
        display_name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        auth_method:
          type: string
          enum: [password, private_key]
        tags:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_connected_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean

    HostKeyInfo:
      type: object
      required: [key_type, fingerprint, public_key]
      properties:
        key_type:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint shown to the operator.
        public_key:
          type: string
          description: Base64 SSH wire-format public key. Not secret.

    Capabilities:
      type: object
      properties:
        os:
          type: string
        kernel:
          type: string
        architecture:
          type: string
        distribution:
          type: string
        systemd:
          type: boolean
        journalctl:
          type: boolean
        proc:
          type: boolean
        process_tools:
          type: boolean
        disk_tools:
          type: boolean
        sftp:
          type: boolean
        detected_at:
          type: string
          format: date-time

    ConnectionTest:
      type: object
      required: [server, host_key, capabilities]
      properties:
        server:
          $ref: "#/components/schemas/Server"
        host_key:
          $ref: "#/components/schemas/HostKeyInfo"
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    TrustHostKeyRequest:
      type: object
      additionalProperties: false
      required: [fingerprint, key_type, public_key]
      properties:
        fingerprint:
          type: string
        key_type:
          type: string
        public_key:
          type: string
        replace:
          type: boolean
          default: false
          description: Replace an existing approved key after deliberate re-verification.

    FileEntry:
      type: object
      required: [name, path, type, size, mode, modified_at]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
        modified_at:
          type: string
          format: date-time
        uid:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64

    FileListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        truncated:
          type: boolean

    FileContent:
      type: object
      required: [path, content, size, mode, modified_at]
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
          format: int64
        mode:
          type: string
        modified_at:
          type: string
          format: date-time

    PathRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string

    RenameRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        overwrite:
          type: boolean
          default: false

    WriteFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        expected_modified_at:
          type: string
          format: date-time
        expected_size:
          type: integer
          format: int64
