# Nginx reverse proxy for Drovik.
# Replace drovik.example.com and certificate paths. Keep Drovik bound to
# 127.0.0.1:8080 so it is not exposed directly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name drovik.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name drovik.example.com;

    ssl_certificate     /etc/letsencrypt/live/drovik.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drovik.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Match the deployment policy. File transfers stream through the backend.
    client_max_body_size 2g;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Terminal WebSockets and long transfers need a long read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080/readyz;
        access_log off;
    }
}
